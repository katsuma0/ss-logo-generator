<script>
const logo = document.getElementById('logo');
const PNG_WIDTH = 2000;

// accepts 568bfc, #568bfc, #58f and any css colour name the browser knows
function parse(v) {
  v = v.trim();
  if (/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v)) v = '#' + v;
  const s = new Option().style;
  s.color = v;
  if (!s.color) return null;
  const c = document.createElement('canvas').getContext('2d');
  c.fillStyle = v;
  return c.fillStyle.toUpperCase();
}

function hook(k) {
  const pick = document.getElementById('p' + k), text = document.getElementById('t' + k);
  const label = document.getElementById('l' + k), path = document.getElementById(k);
  text.addEventListener('input', () => {
    const c = parse(text.value);
    label.classList.toggle('bad', !c);
    if (!c) return;
    path.setAttribute('fill', c);
    if (c.startsWith('#')) pick.value = c.toLowerCase();
  });
  pick.addEventListener('input', () => {
    text.value = pick.value.toUpperCase();
    label.classList.remove('bad');
    path.setAttribute('fill', text.value);
  });
}
hook('a'); hook('b');

function svgText() {
  return new XMLSerializer().serializeToString(logo);
}

function name(ext) {
  const f = id => document.getElementById(id).getAttribute('fill').replace('#', '');
  return `ss-${f('a')}-${f('b')}.${ext}`.toLowerCase();
}

function save(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById('svgdl').onclick = () =>
  save(new Blob([svgText()], { type: 'image/svg+xml' }), name('svg'));

document.getElementById('png').onclick = () => {
  const [, , w, h] = logo.getAttribute('viewBox').split(' ').map(Number);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = PNG_WIDTH;
    c.height = Math.round(PNG_WIDTH * h / w);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => save(b, name('png')), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText());
};
</script>
